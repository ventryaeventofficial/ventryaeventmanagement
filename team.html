<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/Logo2.png">
  <title>Team & Staff Access - Ventrya</title>
  <link rel="stylesheet" href="checked-in.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .team-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 24px;
    }
    @media (max-width: 768px) {
      .team-grid {
        grid-template-columns: 1fr;
      }
    }
    .form-card, .list-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.875rem;
      outline: none;
      box-sizing: border-box;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #6366f1;
    }
    .team-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }
    .team-table th {
      background: rgba(15, 23, 42, 0.4);
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
    }
    .team-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      color: #cbd5e1;
    }
    .team-table tr:last-child td {
      border-bottom: none;
    }
    .role-badge {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(129, 140, 248, 0.15);
      color: #818cf8;
      border: 1px solid rgba(129, 140, 248, 0.3);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .action-btn {
      background: none;
      border: none;
      color: #fb7185;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .action-btn:hover {
      background: rgba(251, 113, 133, 0.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="page-header">
      <div>
        <h1 class="page-title">
          <i class="fa-solid fa-users-gear text-indigo"></i>
          Team & Staff Access
        </h1>
        <p id="eventHeaderTitle" class="event-subtitle">Event: Loading...</p>
      </div>

      <div class="header-actions">
        <a id="backToAttendeesBtn" href="#" class="btn btn-secondary">
          <i class="fa-solid fa-arrow-left"></i> Back to Attendees
        </a>
      </div>
    </header>

    <!-- Main Grid Layout -->
    <div class="team-grid">
      <!-- Left Column: Invite Staff Form -->
      <div class="form-card">
        <h3 style="margin-top: 0; color: #ffffff; font-size: 1.125rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-user-plus text-indigo"></i> Add Team Member
        </h3>
        
        <form id="addStaffForm">
          <div class="form-group">
            <label for="staffEmail">Staff Email Address *</label>
            <input type="email" id="staffEmail" placeholder="staff@example.com" required>
          </div>

          <div class="form-group">
            <label for="staffRole">Access Role *</label>
            <select id="staffRole" required>
              <option value="scanner">QR Scanner Operator</option>
              <option value="moderator">Event Moderator / Assistant</option>
              <option value="admin">Co-Admin</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
            <i class="fa-solid fa-paper-plane"></i> Grant Access
          </button>
        </form>
      </div>

      <!-- Right Column: Staff List Table -->
      <div class="list-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 12px;">
          <h3 style="margin: 0; color: #ffffff; font-size: 1.125rem; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-shield-halved text-emerald"></i> Authorized Staff
          </h3>
          <span id="staffCountBadge" style="background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;">0 Members</span>
        </div>

        <div style="overflow-x: auto;">
          <table class="team-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Role</th>
                <th>Date Added</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="staffTableBody">
              <tr>
                <td colspan="4" style="text-align: center; color: #94a3b8; padding: 30px;">
                  Loading staff list...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="team.js" type="module"></script>
</body>
</html>
