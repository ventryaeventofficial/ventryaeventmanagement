<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seating Chart - Ventrya</title>
  <link rel="stylesheet" href="checked-in.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
  --primary: #800080;
  --bg-light: #F8F9FC;
    --text-dark: #1F2937;
    --text-muted: #FF7A00;
    --white: #ffffff;
  
  /* Helper Tokens */
  --primary-hover: #380038;
  --border-color: #380038;
  --shadow-sm: 0 4px 12px rgba(35, 31, 32, 0.05);
  --shadow-lg: 0 12px 28px rgba(91, 26, 45, 0.15);
  --radius: 12px;
  --transition: all 0.25s ease;
}
    
    .search-container {
      margin-bottom: 20px;
    }
    .search-wrapper {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #050505;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .seating-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .table-card {
      background: var(--bg-light);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .table-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .table-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seat-count-badge {
      background: rgba(129, 140, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(129, 140, 248, 0.2);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .guest-list-group {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .guest-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      font-size: 0.875rem;
      color: #030303;
    }
    .guest-item:last-child {
      border-bottom: none;
    }
    .seat-tag {
      font-size: 0.75rem;
      color: var(--bg-light);
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="page-header">
      <div>
        <h1 class="page-title">
          <i class="fa-solid fa-chair text-indigo"></i>
          Seating Chart Overview
        </h1>
        <p id="eventHeaderTitle" class="event-subtitle">Event: Loading...</p>
      </div>

      <div class="header-actions">
        <a id="backToAttendeesBtn" href="#" class="btn btn-secondary">
          <i class="fa-solid fa-users"></i> Back to Attendees
        </a>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Tables</span>
        <p id="statTotalTables" class="stat-value text-indigo">0</p>
      </div>
      <div class="stat-card">
        <span class="stat-label">Seated Guests</span>
        <p id="statAssigned" class="stat-value text-emerald">0</p>
      </div>
      <div class="stat-card stat-card-wide">
        <span class="stat-label">Unassigned Guests</span>
        <p id="statUnassigned" class="stat-value text-light">0</p>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input 
          type="text" 
          id="seatSearchInput" 
          placeholder="Search by guest name, phone, table, or seat number..." 
          class="search-input"
        />
      </div>
    </div>

    <!-- Seating Cards Grid -->
    <div id="seatingGrid" class="seating-grid">
      <div style="grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 40px;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 8px; display: block;"></i>
        Loading seating arrangements...
      </div>
    </div>
  </div>

  <script src="seating-chart.js" type="module"></script>
</body>
</html>
