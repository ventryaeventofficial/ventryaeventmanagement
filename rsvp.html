<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <link rel="icon" type="image/png" href="/images/Logo2.png">
  <title>Event RSVP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
        --primary: #800080;
        --bg-light: #F8F9FC;
          --text-dark: #1F2937;
          --text-muted: #FF7A00;
          --white: #ffffff;
        
        /* Helper Tokens */
        --primary-hover: #380038;
        --border-color: #380038;
        --shadow-sm: 0 4px 12px rgba(35, 31, 32, 0.05);
        --shadow-lg: 0 12px 28px rgba(91, 26, 45, 0.15);
        --radius: 12px;
        --transition: all 0.25s ease;
      }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 5%;
      flex-direction: column;
    }

    /* Fixed Card Container Width on Mobile */
    .rsvp-card {
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 440px; /* Keeps form box constrained */
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      margin: auto;
    }

    .event-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #27272a;
    }

    .event-header h2 {
      font-size: 1.35rem;
      color: var(--text-dark);
      margin-bottom: 6px;
      word-break: break-word;
    }

    .event-header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-light);
      color: var(--text-dark);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--text-dark);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 8px;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 480px) {
      body {
        padding: 30px;
        padding-top: 100px;
      }
      .rsvp-card {
        margin-top: 20px;
        padding: 20px 16px;
        border-radius: 12px;
      }
    }

    .footer-container {
      display: flex;
      height: 100px;
      justify-content: center;
      align-items: center;
      width: 100%;
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-direction: row;
    }
    
    .footer-content{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-content p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .logo img{
    width: 120px;
    z-index: 2; /* Keeps logo above absolute menu element */
    }

    @media (max-width: 480px) {
      .footer-container {
        flex-direction: column;
        gap: 6px;
      }
      .footer-content {
        flex-direction: column;
        gap: 4px;
      }
    }

    .header h1 {
    text-align: center; font-size: 1.5rem; color: var(--primary); margin-bottom: 4px;
    }

    .header p {
      text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>You're Invited!</h1>
    <p>Please RSVP to confirm your attendance.</p>
  </div>
  <div class="rsvp-card">
    <div class="event-header">
      <h2 id="eventTitle">Loading Event...</h2>
      <p id="eventDetails"><i class="fa-solid fa-spinner fa-spin"></i> Fetching details...</p>
    </div>
    
    <form id="publicRsvpForm">
      <div class="form-group">
        <label>Your Name *</label>
        <input type="text" id="guestName" required placeholder="e.g. Alex Johnson" />
      </div>
      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" id="guestPhone" required placeholder="e.g. 08012345678" />
      </div>
      <div class="form-group">
        <label>Plus One Name (Optional)</label>
        <input type="text" id="plusOneName" placeholder="e.g. Sam Johnson" />
      </div>
      <div class="form-group">
        <label>Plus One Phone (Optional)</label>
        <input type="tel" id="plusOnePhone" placeholder="e.g. 08087654321" />
      </div>
      <button type="submit" id="submitBtn">Confirm RSVP</button>
    </form>
  </div>

  <footer class="footer-container">
      <div class="footer-content">
         <p>
          Powered by
         </p>
           <!-- Logo -->
        <a href="https://ventryaeventmanagement.com" target="_blank" class="logo">
            <img src="images/Logo.png" alt="Ventrya Logo">
        </a>
          <p>&copy; Copyright Ventrya. All rights reserved.</p>
         
      </div>
  </footer>

  <script type="module" src="rsvp.js"></script>
</body>
</html>
