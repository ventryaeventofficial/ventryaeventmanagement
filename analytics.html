<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/Logo2.png">
  <title>Advanced Analytics - Ventrya</title>
  <link rel="stylesheet" href="checked-in.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .metric-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .metric-card h3 {
      font-size: 0.875rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-value {
      font-size: 2.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
    }
    .chart-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .chart-box h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      font-size: 0.875rem;
      color: #cbd5e1;
    }
    .stat-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="page-header">
      <div>
        <h1 class="page-title">
          <i class="fa-solid fa-chart-line text-indigo"></i>
          Advanced Event Analytics
        </h1>
        <p id="eventHeaderTitle" class="event-subtitle">Event: Loading...</p>
      </div>

      <div class="header-actions">
  <a id="backToAttendeesBtn" href="attendees.html" class="btn btn-secondary" style="cursor: pointer; position: relative; z-index: 10;">
    <i class="fa-solid fa-arrow-left"></i> Back to Attendees
  </a>
</div>
    </header>

    <!-- Top KPI Grid -->
    <div class="analytics-grid">
      <div class="metric-card">
        <h3>Total Invitations Sent</h3>
        <p id="statTotal" class="metric-value">0</p>
      </div>
      <div class="metric-card">
        <h3>Checked-In Guests</h3>
        <p id="statCheckedIn" class="metric-value" style="color: #10b981;">0</p>
      </div>
      <div class="metric-card">
        <h3>Peak Turnout Rate</h3>
        <p id="statRate" class="metric-value" style="color: #f59e0b;">0%</p>
      </div>
    </div>

    <!-- Detailed Insights Grid -->
    <div class="analytics-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 0;">
      <div class="chart-box">
        <h3><i class="fa-solid fa-clock text-indigo"></i> Arrival Timeline Breakdown</h3>
        <div id="arrivalTimelineList">
          <p style="color: #94a3b8; font-size: 0.875rem;">Calculating arrival distributions...</p>
        </div>
      </div>

      <div class="chart-box">
        <h3><i class="fa-solid fa-chair text-indigo"></i> Seating Capacity Utilization</h3>
        <div id="seatingUtilizationList">
          <p style="color: #94a3b8; font-size: 0.875rem;">Analyzing seating distribution...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="analytics.js" type="module"></script>
</body>
</html>
