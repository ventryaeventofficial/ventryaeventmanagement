<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Attendance Monitor - Ventrya</title>
  <link rel="stylesheet" href="checked-in.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .live-monitor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .monitor-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .monitor-card h3 {
      font-size: 0.875rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .monitor-value {
      font-size: 2.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
    }
    .feed-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
    }
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 2s infinite;
      margin-right: 6px;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .feed-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      margin-bottom: 10px;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="page-header">
      <div>
        <h1 class="page-title">
          <i class="fa-solid fa-tower-broadcast text-emerald"></i>
          Live Attendance Monitor
        </h1>
        <p id="eventHeaderTitle" class="event-subtitle">Event: Loading...</p>
      </div>

      <div class="header-actions">
        <a id="backToAttendeesBtn" href="#" class="btn btn-secondary">
          <i class="fa-solid fa-users"></i> Back to Attendees
        </a>
      </div>
    </header>

    <!-- Metrics Grid -->
    <div class="live-monitor-grid">
      <div class="monitor-card">
        <h3>Total Checked-In</h3>
        <p id="liveCheckedInCount" class="monitor-value" style="color: #10b981;">0</p>
      </div>
      <div class="monitor-card">
        <h3>Expected Guests</h3>
        <p id="liveTotalCapacity" class="monitor-value text-indigo">0</p>
      </div>
      <div class="monitor-card">
        <h3>Live Turnout Rate</h3>
        <p id="liveTurnoutRate" class="monitor-value" style="color: #f59e0b;">0%</p>
      </div>
    </div>

    <!-- Recent Check-In Stream -->
    <div class="feed-container">
      <div class="feed-header">
        <h3 style="margin: 0; color: #ffffff; font-size: 1.125rem; display: flex; align-items: center;">
          <span class="pulse-dot"></span> Real-Time Check-In Feed
        </h3>
        <span style="font-size: 0.75rem; color: #94a3b8;">Auto-refreshes every 10 seconds</span>
      </div>
      
      <div id="liveCheckInFeed">
        <div style="text-align: center; color: #94a3b8; padding: 30px;">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px; margin-bottom: 8px; display: block;"></i>
          Waiting for incoming check-ins...
        </div>
      </div>
    </div>
  </div>

  <script src="live-attendance.js" type="module"></script>
</body>
</html>
