<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Management - Ventrya</title>
  <link rel="stylesheet" href="checked-in.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .vendor-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 100%;
    }
    
    /* Summary Stat Cards Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 4px;
    }
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .stat-info span {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      font-weight: 600;
    }
    .stat-info h3 {
      margin: 2px 0 0 0;
      font-size: 1.5rem;
      color: #f8fafc;
      font-weight: 700;
    }

    .form-card, .list-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      box-sizing: border-box;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.875rem;
      outline: none;
      box-sizing: border-box;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #6366f1;
    }
    
    .table-responsive-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
    }
    .vendor-table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }
    .vendor-table th {
      background: rgba(15, 23, 42, 0.8);
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      white-space: nowrap;
    }
    .vendor-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      color: #cbd5e1;
    }
    .vendor-table tr:last-child td {
      border-bottom: none;
    }
    
    /* Status Badges */
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-confirmed {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-booked {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .status-pending {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .action-btn {
      background: none;
      border: none;
      color: #fb7185;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 6px 10px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .action-btn:hover {
      background: rgba(251, 113, 133, 0.1);
    }

    /* Interactive Status Dropdown Styles */
    .status-dropdown {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .status-dropdown.status-confirmed {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .status-dropdown.status-confirmed option {
      background: #0f172a;
      color: #10b981;
    }
    .status-dropdown.status-booked {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border-color: rgba(99, 102, 241, 0.3);
    }
    .status-dropdown.status-booked option {
      background: #0f172a;
      color: #818cf8;
    }
    .status-dropdown.status-pending {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .status-dropdown.status-pending option {
      background: #0f172a;
      color: #fbbf24;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="page-header">
      <div>
        <h1 class="page-title">
          <i class="fa-solid fa-store text-indigo"></i>
          Vendor Management
        </h1>
        <p id="eventHeaderTitle" class="event-subtitle">Event: Loading...</p>
      </div>

      <div class="header-actions">
        <a id="backToAttendeesBtn" href="#" class="btn btn-secondary">
          <i class="fa-solid fa-arrow-left"></i> Back to Attendees
        </a>
      </div>
    </header>

    <!-- Main Stacked Layout -->
    <div class="vendor-container">
      
      <!-- Summary Metrics Cards Bar -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(99, 102, 241, 0.15); color: #818cf8;">
            <i class="fa-solid fa-store"></i>
          </div>
          <div class="stat-info">
            <span>Total Vendors</span>
            <h3 id="statTotalVendors">0</h3>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: #10b981;">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <div class="stat-info">
            <span>Confirmed</span>
            <h3 id="statConfirmedVendors">0</h3>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background: rgba(99, 102, 241, 0.15); color: #818cf8;">
            <i class="fa-solid fa-file-contract"></i>
          </div>
          <div class="stat-info">
            <span>Booked / Pending</span>
            <h3 id="statBookedPendingVendors">0</h3>
          </div>
        </div>
      </div>

      <!-- Top: Add Vendor Form -->
      <div class="form-card">
        <h3 style="margin-top: 0; color: #ffffff; font-size: 1.125rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-plus text-indigo"></i> Add New Vendor
        </h3>
        
        <form id="addVendorForm">
          <div class="form-row">
            <div class="form-group">
              <label for="vendorName">Vendor / Company Name *</label>
              <input type="text" id="vendorName" placeholder="e.g. Grand Catering Co." required>
            </div>
            <div class="form-group">
              <label for="vendorCategory">Category *</label>
              <select id="vendorCategory" required>
                <option value="Catering & Bar">Catering & Bar</option>
                <option value="Photography & Video">Photography & Video</option>
                <option value="DJ & Sound">DJ & Sound</option>
                <option value="Decor & Florals">Decor & Florals</option>
                <option value="Security">Security</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="vendorPhone">Phone Number</label>
              <input type="text" id="vendorPhone" placeholder="+1 (555) 000-0000">
            </div>
            <div class="form-group">
              <label for="vendorEmail">Email Address</label>
              <input type="email" id="vendorEmail" placeholder="vendor@example.com">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="vendorStatus">Status</label>
              <select id="vendorStatus">
                <option value="Confirmed">Confirmed</option>
                <option value="Booked">Booked</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
            <div class="form-group" style="display: flex; align-items: flex-end;">
              <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 42px;">
                <i class="fa-solid fa-check"></i> Save Vendor
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Bottom: Booked Vendors Table with Isolated Scroll -->
      <div class="list-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 12px;">
          <h3 style="margin: 0; color: #ffffff; font-size: 1.125rem; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-list-check text-emerald"></i> Booked Vendors
          </h3>
          <span id="vendorCountBadge" style="background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;">0 Vendors</span>
        </div>

        <div class="table-responsive-wrapper">
          <table class="vendor-table">
            <thead>
              <tr>
                <th>Vendor</th>
                <th>Category</th>
                <th>Contact</th>
                <th>Status</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="vendorTableBody">
              <tr>
                <td colspan="5" style="text-align: center; color: #94a3b8; padding: 30px;">
                  Loading vendors...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="vendors.js" type="module"></script>
</body>
</html>
